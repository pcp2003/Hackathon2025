services:
  # Frontend Service - React + Vite + Nginx
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: naviacess-frontend
    ports:
      - "3000:80"
    networks:
      - naviacess-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - backend

  # Backend Service - FastAPI
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: naviacess-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - API_ENV=development
    volumes:
      - ./backend:/app
    networks:
      - naviacess-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  naviacess-network:
    driver: bridge
